name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - release
          - pre-release

permissions:
  contents: write

jobs:
  setup-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

  build-universal:
    runs-on: ubuntu-latest
    needs: setup-java
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 36
          ndk-version: r28
          emulator: false
          licenses: all

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "::error::Missing secret KEYSTORE"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_ALIAS_PASSWORD }}" ]; then
            echo "::error::Missing secret KEYSTORE_ALIAS_PASSWORD"
            exit 1
          fi

      - name: Get version info
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName\s*=\s*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode\s*=\s*\([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not extract versionName or versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build universal APK
        shell: bash
        run: |
          printf '%s\n' \
            "storeFile=../keystore.jks" \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" \
            "keyPassword=${{ secrets.KEYSTORE_ALIAS_PASSWORD }}" \
            > signing.properties
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks
          VERSION="${{ steps.version.outputs.version_name }}"
          ./gradlew assembleRelease --no-daemon --stacktrace
          FILENAME=$(jq -r '.elements[0].outputFile' app/build/outputs/apk/release/output-metadata.json)
          cp "app/build/outputs/apk/release/$FILENAME" "app/build/outputs/apk/release/Hail-v${VERSION}.apk"
          ls -la app/build/outputs/apk/release/

      - name: Upload universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: universal
          path: app/build/outputs/apk/release/Hail-v${{ steps.version.outputs.version_name }}.apk
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [build-universal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: List artifacts
        shell: bash
        run: find artifacts/ -type f

      - name: Read changelog
        id: changelog
        shell: bash
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "No changelog found." >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            exit 0
          fi
          VERSION="${{ needs.build-universal.outputs.version_name }}"
          {
            echo "body<<EOF"
            sed -n "/^## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '1d;$d' | sed '/^$/d'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-universal.outputs.tag }}
          name: v${{ needs.build-universal.outputs.version_name }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: ${{ github.event.inputs.release_type == 'pre-release' }}
          overwrite: true
          files: |
            artifacts/universal/Hail-v${{ needs.build-universal.outputs.version_name }}.apk

      - name: Notify Telegram
        shell: bash
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_RELEASE: ${{ secrets.TG_RELEASE }}
          TG_LOGO: app/src/main/ic_launcher-playstore.png
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          VERSION: ${{ needs.build-universal.outputs.version_name }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.build-universal.outputs.tag }}
        run: |
          bash .github/scripts/tg_release.sh \
            "artifacts/universal/Hail-v${VERSION}.apk"